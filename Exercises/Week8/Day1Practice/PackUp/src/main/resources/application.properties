spring.application.name=PackUp

spring.datasource.url=jdbc:mysql://localhost:3306/packUp
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.show-sql=true

spring.jpa.generate-ddl=true

spring.jpa.hibernate.ddl-auto=create-drop

server.web.error.include-message=always
server.web.error.include-stacktrace=always

greenapi.idInstance=${GREENAPI_ID_INSTANCE}
greenapi.apiTokenInstance=${GREENAPI_API_TOKEN}

greenapi.apiUrl=https://7107.api.greenapi.com

gemini.apiKey=${GEMINI_API_KEY}
gemini.apiUrl=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent
